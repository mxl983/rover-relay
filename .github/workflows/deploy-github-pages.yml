# Build control-dashboard and publish dist/ to the gh-pages branch.
# Avoids the github-pages environment (which blocked liyang-dashboard).
#
# Repo → Settings → Pages → Build and deployment:
#   Source: Deploy from a branch
#   Branch: gh-pages / (root)
name: Deploy GitHub Pages

on:
  push:
    branches: [liyang-dashboard]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: control-dashboard/package-lock.json

      - name: Install & build (GitHub Pages base path)
        working-directory: control-dashboard
        env:
          VITE_BASE_PATH: /rover-relay/
        run: |
          npm ci
          npm run build:github-pages
          touch dist/.nojekyll

      - name: Publish dist/ to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: control-dashboard/dist
          branch: gh-pages
          clean: true
          single-commit: true
          commit-message: chore: deploy mission control to GitHub Pages
