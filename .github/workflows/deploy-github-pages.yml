# Build control-dashboard and force-push dist/ to gh-pages.
# Uses a fresh orphan branch so a broken vendor-rover gitlink on gh-pages
# cannot break checkout/submodule sync.
#
# Repo → Settings → Pages → Build and deployment:
#   Source: Deploy from a branch
#   Branch: gh-pages / (root)
name: Deploy GitHub Pages

on:
  push:
    branches: [liyang-dashboard]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: control-dashboard/package-lock.json

      - name: Install & build (GitHub Pages base path)
        working-directory: control-dashboard
        env:
          VITE_BASE_PATH: /rover-relay/
        run: |
          npm ci
          npm run build:github-pages
          touch dist/.nojekyll

      - name: Force-publish dist/ to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cp -a control-dashboard/dist/. "$work/"
          touch "$work/.nojekyll"
          cd "$work"
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: deploy mission control to GitHub Pages"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
