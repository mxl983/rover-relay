# Nav2 for lidar-only Cartographer localization (no AMCL / map_server).
# Cartographer publishes map→odom→base_link and /map.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    # BT action acknowledgement timeout is milliseconds. 20 ms allowed a
    # late FollowPath goal to become orphaned after NavigateToPose aborted.
    default_server_timeout: 2000
    wait_for_service_timeout: 5
    # Collision ahead → clear / replan around (forward). BackUp only as last-resort
    # trap escape in navigate_stable.xml. No Spin — those hunted yaw with WASD.
    default_nav_to_pose_bt_xml: "/opt/ros2-nav/config/navigate_stable.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # Collision ahead should escalate into BackUp / replan (BT), not freeze.
    failure_tolerance: 2.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Pure spin does not count — keep allowance long and radius small so
      # slow skid-steer still registers progress while arcing onto the path.
      required_movement_radius: 0.05
      movement_time_allowance: 60.0
    general_goal_checker:
      # Require XY + yaw together (stateful XY latch caused 20–50 cm drift
      # while fixing yaw and still reported success).
      stateful: false
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.08
    # Regulated Pure Pursuit: good for skid-steer indoor nav with rotate-to-heading.
    # Not holonomic — linear.y stays zero; tank turns via angular.z only.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # Cruise ~0.30 m/s ≈ Pi stick y≈−0.6 (char table); peak stick ~0.56 m/s.
      desired_linear_vel: 0.30
      lookahead_dist: 0.45
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.80
      lookahead_time: 1.2
      transform_tolerance: 0.5
      use_velocity_scaled_lookahead_dist: true
      # The Pi drive conversion cannot move reliably below ~0.08 m/s.
      # Keep the final approach above that physical floor instead of emitting
      # a Twist that translates to a neutral stick.
      min_approach_linear_velocity: 0.16
      approach_velocity_scaling_dist: 1.20
      # With scan+static local costmap, "collision ahead" often false-trips near
      # inflation and leaves rotate-to-heading spinning with vx=0.
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 0.7
      use_regulated_linear_velocity_scaling: true
      # Cost scaling was crushing vx≈0 near inflation; PP then emits tiny wz only
      # (nav-20260826-073411) and the Pi never moves. Curvature scaling is enough.
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.65
      regulated_linear_scaling_min_speed: 0.08
      cost_scaling_dist: 0.40
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      use_rotate_to_heading: true
      allow_reversing: false
      # Use pure rotation for modest heading errors too. Below this threshold,
      # RPP's tiny curved-pursuit turn can fall below the rover drive floor.
      rotate_to_heading_min_angle: 0.52
      # Must clear Pi static friction once mapped (see PURE_ROTATE_COMMIT_RPS).
      # Slower pure heading turns give Cartographer more time to catch up.
      rotate_to_heading_angular_vel: 0.30
      max_angular_accel: 0.60
      max_robot_pose_search_dist: 1.5
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 8.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      # Physical rover ~35 cm; pad so planned/followed paths stay off corners.
      footprint: "[[0.175, 0.175], [0.175, -0.175], [-0.175, -0.175], [-0.175, 0.175]]"
      footprint_padding: 0.04
      transform_tolerance: 0.5
      track_unknown_space: false
      # Static /map base so rolling window is not all-unknown (RPP treats
      # unknown as collision → vx=0 spin-only). Live scan still marks obstacles.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: /map
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.40
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_nav
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          obstacle_max_range: 4.0
          # Ignore body/near-field returns that paint lethal cells under the robot.
          obstacle_min_range: 0.28
          inf_is_valid: true
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[0.175, 0.175], [0.175, -0.175], [-0.175, -0.175], [-0.175, 0.175]]"
      footprint_padding: 0.04
      resolution: 0.05
      transform_tolerance: 0.5
      # Never route through unobserved space just because it is not yet a wall.
      track_unknown_space: true
      # Humble's StaticLayer declares these legacy parameters at the costmap
      # root (not under static_layer). Values >=65 must be lethal everywhere
      # the dashboard renders a structural wall.
      lethal_cost_threshold: 65
      trinary_costmap: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: /map
        subscribe_to_updates: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_nav
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.28
          inf_is_valid: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Stronger gradient pushes NavFn away from corners/edges while still
        # allowing a narrow pass when that is the only route.
        cost_scaling_factor: 2.8
        inflation_radius: 0.55
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: false
      # Keep goal pose yaw on the path end so RPP rotates to marker heading
      # (not the final approach tangent) once inside xy_goal_tolerance.
      use_final_approach_orientation: false

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5
    # Shorter lookahead so BackUp/DriveOnHeading don't abort on distant clutter.
    simulate_ahead_time: 0.8
    max_rotational_vel: 0.8
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.4

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # Match drive_interface / Pi char: forward ≤0.35 m/s, no lateral, yaw ≤0.80.
    max_velocity: [0.35, 0.0, 0.80]
    min_velocity: [-0.05, 0.0, -0.80]
    max_accel: [0.50, 0.0, 2.50]
    max_decel: [-0.60, 0.0, -2.50]
    odom_topic: "odom"
    odom_duration: 0.1
    # Low deadbands — 0.04 linear was zeroing creep vx from RPP near goals/costs.
    deadband_velocity: [0.02, 0.0, 0.02]
    velocity_timeout: 0.8

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
